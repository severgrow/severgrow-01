<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Your verification code</title>
</head>
<!-- FUTASAKU transactional mail — reauthentication (code only: this template has no link).
     Rules this file keeps: table layout, inline styles only, no <style>, no images, no SVG,
     no CSS variables, no web fonts, one solid background per surface. -->
<body style="margin:0;padding:0;background-color:#101112;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;background-color:#101112;">
  <tr>
    <td align="center" style="padding:36px 12px 8px 12px;">
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:520px;border-collapse:separate;background-color:#18191a;border-radius:16px;">
        <tr>
          <td style="padding:40px 34px 36px 34px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:16px;line-height:1.55;color:#eeebe4;">
            <p style="margin:0 0 30px 0;font-size:11px;font-weight:600;letter-spacing:0.32em;color:#b7a98a;">FUTASAKU</p>
            <h1 style="margin:0 0 12px 0;font-size:25px;line-height:1.28;font-weight:600;letter-spacing:-0.01em;color:#eeebe4;">Your verification code</h1>
            <p style="margin:0 0 22px 0;font-size:16px;line-height:1.55;color:#dedad2;">Enter this code to confirm it is you. It is valid for one hour.</p>
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-collapse:separate;background-color:#232425;border-radius:12px;">
              <tr>
                <td align="center" style="padding:20px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:0.2em;color:#efe5cb;">{{ .Token }}</td>
              </tr>
            </table>
            <p style="margin:30px 0 0 0;font-size:13px;line-height:1.55;color:#a6a49f;">If you did not ask for this, you can ignore this email.</p>
          </td>
        </tr>
      </table>
      <table role="presentation" width="520" cellpadding="0" cellspacing="0" border="0" style="width:100%;max-width:520px;border-collapse:collapse;">
        <tr>
          <td align="center" style="padding:20px 8px 8px 8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;font-size:12px;line-height:1.6;color:#8a8883;">
            <p style="margin:0 0 4px 0;"><a href="https://www.futasaku.com" style="color:#a6a29b;text-decoration:none;">futasaku.com</a></p>
            <p style="margin:0;">A one-time message about your FUTASAKU account.</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
