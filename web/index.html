<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14201a" />
    <title>Severgrow</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpolygon points=%2716,2 28,9 28,23 16,30 4,23 4,9%27 fill=%27%232f9e5b%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main id="app">
      <header class="top">
        <h1>Severgrow</h1>
        <button id="coach-toggle" class="toggle" type="button" aria-pressed="true">Coach: ON</button>
      </header>
      <div class="game-bar">
        <button id="new-game" class="ghost" type="button">New game</button>
        <button id="tutorial-game" class="ghost" type="button">Tutorial game</button>
      </div>

      <section class="summary" aria-label="How to play">
        <p>Grow your network.</p>
        <p>Keep it joined to your root.</p>
        <p>Cut the bot's links.</p>
      </section>

      <section id="coach" class="coach" aria-label="Coach" hidden>
        <div class="coach-head">
          <b>Coach</b>
          <span id="coach-step" class="muted small"></span>
        </div>
        <div id="coach-advice">
          <p><b>Suggested:</b> <span id="coach-suggested"></span></p>
          <p><b>Why:</b> <span id="coach-why"></span></p>
          <p id="coach-tip" class="tip"></p>
          <div class="coach-actions">
            <button id="coach-show" class="ghost" type="button">Show me</button>
            <button id="coach-do" type="button">Do it for me</button>
            <button id="coach-next" class="link" type="button">Not this, show another</button>
          </div>
        </div>
        <div id="coach-summary" hidden>
          <p><b id="coach-summary-title"></b></p>
          <ul id="coach-summary-list"></ul>
          <div class="coach-actions">
            <button id="coach-summary-ok" type="button">Got it</button>
          </div>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>

      <section class="scores" aria-label="Scores">
        <div class="pill you"><span class="dot"></span>You <b id="score-you">0</b></div>
        <div class="pill bot"><span class="dot"></span>Bot <b id="score-bot">0</b></div>
        <div class="pill" title="Cards left in the deck">Deck <b id="deck">0</b></div>
        <div class="pill" title="Top of the discard pile">Discard <b id="discard">–</b></div>
      </section>

      <svg id="board" class="board" role="img" aria-label="Hex board"></svg>
      <p id="tile-info" class="tile-info">Tap a tile to see what you would lose if it were cut.</p>

      <section aria-label="Your cards">
        <div class="row-head">
          <h2>Your cards</h2>
          <span id="deadwood" class="muted"></span>
        </div>
        <div id="hand" class="hand"></div>
        <p id="bot-hand" class="muted small"></p>
      </section>

      <section aria-label="Your moves">
        <div class="row-head">
          <h2>Your moves</h2>
          <button id="clear-filter" class="link" type="button" hidden>Show all</button>
        </div>
        <p id="hint" class="muted small"></p>
        <div id="confirm" class="confirm" hidden>
          <span id="confirm-text"></span>
          <p id="confirm-warn" class="warn" hidden></p>
          <button id="confirm-play" type="button">Play it</button>
          <button id="confirm-cancel" class="ghost" type="button">Cancel</button>
        </div>
        <div id="moves" class="moves"></div>
      </section>

      <section aria-label="What happened">
        <h2>What happened</h2>
        <ul id="log" class="log"></ul>
      </section>

      <p class="muted small footer">
        <button id="restart-tutorial" class="link" type="button">Restart tutorial</button>
      </p>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
