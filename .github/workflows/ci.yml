name: CI

on:
  # every branch except dev and live. dev: the old test copy skips the strict checks for speed.
  # live: it only ever moves to a commit that already passed CI on futa0.5-online (`npm run promote`,
  # docs/RELEASE-FLOW.md), and the publish gate finds that run by commit, so re-running it is waste.
  push:
    branches-ignore: [dev, live]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-channel-assets.mjs
      - run: CHANNEL=futa-test npm run web:build && CHANNEL=futa-test node scripts/check-channel-assets.mjs

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    strategy:
      fail-fast: false
      matrix:
        # Every suite here tests what this branch SHIPS: futa04-*, cut-severe, daily-puzzle and the
        # territory suites build the product channel; lessons-3 (levels 1-10, the tutorial) builds futa05.
        # REMOVED 2026-10-29: smoke, painting, overhaul, monkey, emptyturn, fruitcards and propass built
        # the historic `live` channel (Main, now frozen at /firststep/ and rebuilt from its own SHA), which
        # this branch never publishes; smoke also flaked and cost a full re-run of a deploy. They still
        # run wherever that channel is developed. territory-gestures-ios runs on WebKit: it is the suite
        # that would have caught the iPhone pan/pinch freeze that Chromium missed (2026-10-28).
        suite: [futa04-critical, futa04-information, futa04-tutorial-intel, futa04-tutorial-lock, futa04-motion, cut-severe, daily-puzzle, lessons-3, territory-menu, territory-challenges, territory-gestures, territory-gestures-ios]
    # PINNED, not `ubuntu-latest`: GitHub moved `ubuntu-latest` to 26.04 during 2026-10-28, and
    # Playwright 1.56.1 refuses it ("Playwright does not support chromium on ubuntu26.04-x64"),
    # which failed EVERY browser job at `playwright-core install` before a single test ran. Pin the
    # last image the pinned Playwright supports; unpin when Playwright ships 26.04 support.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the browser this suite drives
        run: |
          case "${{ matrix.suite }}" in
            *-ios) npx playwright-core install --with-deps webkit ;;
            *) npx playwright-core install --with-deps chromium ;;
          esac
      # Legacy suites target the classic live channel. Default npm run web:build is futa04.
      - name: Build the channel this suite tests
        run: |
          case "${{ matrix.suite }}" in
            # territory-challenges stubs every API call itself, against a build pointed at closed port 9.
            territory-challenges) CHANNEL=futa05 VITE_DUEL_API_URL=http://127.0.0.1:9/functions/v1/duel \
                VITE_SUPABASE_URL=http://127.0.0.1:9 VITE_SUPABASE_ANON_KEY=local npm run web:build ;;
            futa04-*|cut-severe|daily-puzzle|territory-*) CHANNEL=futa04 npm run web:build ;;
            # futa05 requires its online endpoints at build time; these placeholders are shaped
            # like the real ones and nothing in lessons-3 talks to them.
            lessons-3) CHANNEL=futa05 VITE_FIND_OPPONENT=1 VITE_DUEL_API_URL=https://ci.invalid/functions/v1/duel \
                VITE_SUPABASE_URL=https://ci.invalid VITE_SUPABASE_ANON_KEY=ci-placeholder npm run web:build ;;
          esac
      - run: node --import tsx web/e2e/${{ matrix.suite }}.ts
