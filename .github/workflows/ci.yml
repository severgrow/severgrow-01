name: CI

on:
  # every branch except dev: the test copy (dev) skips the strict checks for speed; they run
  # on main, on pull requests and before anything is locked in (docs/RELEASES.md)
  push:
    branches-ignore: [dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build

  browser:
    # Plays the built page in a real browser, in every theme (web/e2e/smoke.ts).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run web:build
      - run: npm run e2e
