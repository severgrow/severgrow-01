name: CI

on:
  # every branch except dev and live. dev: the old test copy skips the strict checks for speed.
  # live: it only ever moves to a commit that already passed CI on futa0.5-online (`npm run promote`,
  # docs/RELEASE-FLOW.md), and the publish gate finds that run by commit, so re-running it is waste.
  push:
    branches-ignore: [dev, live]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-channel-assets.mjs
      - run: CHANNEL=futa-test npm run web:build && CHANNEL=futa-test node scripts/check-channel-assets.mjs

  # ONE build per channel, shared by every browser suite (owner, 2026-11-07: fast preview path).
  # Was: each of ~18 matrix jobs rebuilt from scratch (~2–4 min each). Now: two build jobs total.
  build-futa04:
    name: build futa04 (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: CHANNEL=futa04 npm run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-futa04
          path: web/dist
          retention-days: 1

  build-futa05:
    name: build futa05 (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Shared futa05 build for lessons / sphere / planet / territory-challenges. Suites stub the
      # network; WebKit-safe closed port avoids reserved-port failures in constructors.
      - run: >
          CHANNEL=futa05 VITE_FIND_OPPONENT=1
          VITE_DUEL_API_URL=http://127.0.0.1:65530/functions/v1/duel
          VITE_SUPABASE_URL=http://127.0.0.1:65530
          VITE_SUPABASE_ANON_KEY=local
          npm run web:build
      - uses: actions/upload-artifact@v4
        with:
          name: dist-futa05
          path: web/dist
          retention-days: 1

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    needs: [build-futa04, build-futa05]
    strategy:
      fail-fast: false
      matrix:
        # Fast preview path (feature branches / PRs): the suites that catch most product breaks.
        # Full release path (futa0.5-online): every suite below — promote/live still waits for this
        # full CI on the release-branch commit (docs/RELEASE-FLOW.md). Tests are never deleted.
        include:
          # --- always (preview + release) ---
          - { suite: futa04-critical, channel: futa04, tier: always }
          - { suite: futa04-information, channel: futa04, tier: always }
          - { suite: futa04-motion, channel: futa04, tier: always }
          - { suite: lessons-3, channel: futa05, tier: always }
          - { suite: territory-menu, channel: futa04, tier: always }
          - { suite: territory-gestures, channel: futa04, tier: always }
          - { suite: territory-gestures-ios, channel: futa04, tier: always }
          - { suite: sphere-test, channel: futa05, tier: always }
          - { suite: sphere-test-ios, channel: futa05, tier: always }
          - { suite: planet-matte, channel: futa05, tier: always }
          # --- release only (futa0.5-online push / promote gate) ---
          - { suite: futa04-tutorial-intel, channel: futa04, tier: release }
          - { suite: futa04-tutorial-lock, channel: futa04, tier: release }
          - { suite: futa04-lesson-9-free, channel: futa04, tier: release }
          - { suite: cut-severe, channel: futa04, tier: release }
          - { suite: territory-challenges, channel: futa05, tier: release }
          - { suite: living-territory, channel: futa04, tier: release }
          - { suite: living-territory-ios, channel: futa04, tier: release }
          - { suite: territory-final-polish, channel: futa04, tier: release }
    # Skip release-only suites on feature branches / PRs (fast preview). Keep them on the
    # release branch so /test/ and promote still run the full gate.
    if: >
      matrix.tier == 'always' ||
      github.ref == 'refs/heads/futa0.5-online' ||
      github.base_ref == 'futa0.5-online' ||
      github.event_name == 'workflow_dispatch'
    # PINNED, not `ubuntu-latest`: GitHub moved `ubuntu-latest` to 26.04 during 2026-10-28, and
    # Playwright 1.56.1 refuses it ("Playwright does not support chromium on ubuntu26.04-x64"),
    # which failed EVERY browser job at `playwright-core install` before a single test ran. Pin the
    # last image the pinned Playwright supports; unpin when Playwright ships 26.04 support.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install the browser this suite drives
        run: |
          case "${{ matrix.suite }}" in
            *-ios) npx playwright-core install --with-deps webkit ;;
            *) npx playwright-core install --with-deps chromium ;;
          esac
      - name: Restore the shared ${{ matrix.channel }} build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ matrix.channel }}
          path: web/dist
      - run: node --import tsx --import ./scripts/browser-ci-errors.mjs web/e2e/${{ matrix.suite }}.ts

      - name: Keep 0.81 board and Match Intel visual evidence
        if: always() && matrix.suite == 'futa04-information'
        uses: actions/upload-artifact@v4
        with:
          name: foundation-081-screens
          path: |
            /tmp/v081-intel/
            /tmp/v081-board/
            /tmp/main2-shots/
          retention-days: 7

      - name: Keep living Territory visual evidence
        if: always() && (startsWith(matrix.suite, 'living-territory') || matrix.suite == 'territory-final-polish' || startsWith(matrix.suite, 'sphere-test') || matrix.suite == 'planet-matte')
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.suite }}-screens
          path: ${{ matrix.suite == 'planet-matte' && '/tmp/planet-matte/' || matrix.suite == 'territory-final-polish' && '/tmp/territory-final-polish/' || startsWith(matrix.suite, 'sphere-test') && '/tmp/sphere-test/' || '/tmp/living-territory/' }}
          retention-days: 7
