name: CI

on:
  # every branch except dev: the test copy (dev) skips the strict checks for speed; they run
  # on main, on pull requests and before anything is locked in (docs/RELEASES.md)
  push:
    branches-ignore: [dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-channel-assets.mjs
      - run: CHANNEL=test npm run web:build
      - run: CHANNEL=test2 npm run web:build && CHANNEL=test2 node scripts/check-channel-assets.mjs

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    strategy:
      fail-fast: false
      matrix:
        suite: [smoke, painting, overhaul, monkey, emptyturn, fruitcards, propass, test2-critical, test2-v3]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - if: matrix.suite != 'test2-critical' && matrix.suite != 'test2-v3'
        run: npm run web:build
      - if: matrix.suite == 'test2-critical' || matrix.suite == 'test2-v3'
        run: CHANNEL=test2 npm run web:build
      - run: node --import tsx web/e2e/${{ matrix.suite }}.ts ${{ matrix.suite == 'monkey' && '--steps=200' || '' }}
