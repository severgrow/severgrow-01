name: CI

on:
  # every branch except dev: the test copy (dev) skips the strict checks for speed; they run
  # on main, on pull requests and before anything is locked in (docs/RELEASES.md)
  push:
    branches-ignore: [dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-channel-assets.mjs
      - run: CHANNEL=futa-test npm run web:build && CHANNEL=futa-test node scripts/check-channel-assets.mjs

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    strategy:
      fail-fast: false
      matrix:
        # futa04-* suites, cut-severe and daily-puzzle build the product channel; lessons-3 (levels 1-10, the
        # tutorial) builds futa05; the rest build the historic live channel.
        suite: [smoke, painting, overhaul, monkey, emptyturn, fruitcards, propass, futa04-critical, futa04-information, futa04-tutorial-intel, futa04-tutorial-lock, futa04-motion, cut-severe, daily-puzzle, lessons-3, territory-menu]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Legacy suites target the classic live channel. Default npm run web:build is futa04.
      - name: Build the channel this suite tests
        run: |
          case "${{ matrix.suite }}" in
            futa04-*|cut-severe|daily-puzzle|territory-menu) CHANNEL=futa04 npm run web:build ;;
            # futa05 requires its online endpoints at build time; these placeholders are shaped
            # like the real ones and nothing in lessons-3 talks to them.
            lessons-3) CHANNEL=futa05 VITE_FIND_OPPONENT=1 VITE_DUEL_API_URL=https://ci.invalid/functions/v1/duel \
                VITE_SUPABASE_URL=https://ci.invalid VITE_SUPABASE_ANON_KEY=ci-placeholder npm run web:build ;;
            *) CHANNEL=live npm run web:build ;;
          esac
      - run: node --import tsx web/e2e/${{ matrix.suite }}.ts ${{ matrix.suite == 'monkey' && '--steps=200' || '' }}
