name: CI

# The strict checks for Futasaku: on every push except the quick test copy (futa-test), whose
# TEST: work skips them on purpose (AGENTS.md), and on pull requests.
on:
  push:
    branches-ignore: [futa-test, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-build-assets.mjs

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    strategy:
      fail-fast: false
      matrix:
        suite: [quick-smoke, futa04-critical, futa04-information, mega-bomb, monkey]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run web:build
      - run: node --import tsx web/e2e/${{ matrix.suite }}.ts ${{ matrix.suite == 'monkey' && '--steps=200' || '' }}
