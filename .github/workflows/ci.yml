name: CI

on:
  # every branch except dev: the test copy (dev) skips the strict checks for speed; they run
  # on main, on pull requests and before anything is locked in (docs/RELEASES.md)
  push:
    branches-ignore: [dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run web:build && node scripts/check-channel-assets.mjs
      - run: CHANNEL=futa-test npm run web:build && CHANNEL=futa-test node scripts/check-channel-assets.mjs

  browser:
    # Independent suites use separate runners, keeping their assertions and avoiding
    # repeating successful suites when one driver fails.
    strategy:
      fail-fast: false
      matrix:
        # futa04-* suites build the product channel; the rest build the historic live channel.
        suite: [smoke, painting, overhaul, monkey, emptyturn, fruitcards, propass, futa04-critical, futa04-information, futa04-tutorial-intel, futa04-tutorial-lock]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      # Legacy suites target the classic live channel. Default npm run web:build is futa04.
      - if: ${{ !startsWith(matrix.suite, 'futa04-') }}
        run: CHANNEL=live npm run web:build
      - if: ${{ startsWith(matrix.suite, 'futa04-') }}
        run: CHANNEL=futa04 npm run web:build
      - run: node --import tsx web/e2e/${{ matrix.suite }}.ts ${{ matrix.suite == 'monkey' && '--steps=200' || '' }}
