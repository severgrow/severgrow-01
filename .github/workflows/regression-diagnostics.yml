name: Inspect first extra regression failure
on:
  push:
    branches: [diagnostics/extra-ci-40087975275]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this task's failed regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40087975275 --repo severgrow/severgrow-01 --log-failed > failed-regression.log
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const line of readFileSync("failed-regression.log", "utf8").split("\n")) {
              if (/FAIL |EXIT FAILED|AssertionError|retained-heap|heap end/.test(line)) {
                console.log("::notice::" + line.replaceAll("%", "%25").replaceAll("\r", "%0D"));
              }
            }
          '
