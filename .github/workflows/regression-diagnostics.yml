name: Inspect first extra regression failure
on:
  push:
    branches: [diagnostics/extra-ci-40087975275]
permissions:
  actions: write
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read this task's failed regression checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 40087975308 --repo severgrow/severgrow-01 --log-failed > failed-regression.log
          gh run view 40089118986 --repo severgrow/severgrow-01 --log-failed >> failed-regression.log
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            for (const line of readFileSync("failed-regression.log", "utf8").split("\n")) {
              if (/FAIL |EXIT FAILED|Error|page.click|locator resolved|waiting for locator/.test(line)) {
                console.log("::notice::" + line.replaceAll("%", "%25").replaceAll("\r", "%0D"));
              }
            }
          '
      - name: Check existing backend deployment binding
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::notice::Supabase deployment secret is configured in this repository.'
          else
            echo '::notice::No SUPABASE_ACCESS_TOKEN deployment secret is configured in this repository.'
          fi
      - name: Stop superseded feature-branch checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run cancel 40089119013 --repo severgrow/severgrow-01 || true
          gh run cancel 40089118986 --repo severgrow/severgrow-01 || true
