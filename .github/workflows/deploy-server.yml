name: Deploy the server (Supabase Edge function)

# THE SERVER IS PART OF THE RELEASE (owner, 2026-11-12). The page and the server ship together, and
# the server must go first: a page proof against a new bot waits until the server lists that bot
# version (web/src/online/seed-rewards.ts), and Training tickets for a new bot are refused by an old
# server. So once CI is green on futa0.5-online, this deploys the same commit's Edge bundle BEFORE
# anyone promotes, and proves it with /v1/health.
#
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (Settings -> Secrets and variables -> Actions).
# Without it the job says so and skips; nothing fails. The live site keeps working on the old server
# meanwhile, because the server always accepts the bot versions of older pages.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [futa0.5-online]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

env:
  PROJECT_REF: wbfrbeedlvjercrukngn
  HEALTH_URL: https://wbfrbeedlvjercrukngn.supabase.co/functions/v1/duel/v1/health

jobs:
  deploy:
    # Only a green CI on a push to futa0.5-online (or a manual run).
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The committed bundle is the one this commit builds
        run: |
          npm run server:build-edge
          if ! git diff --quiet -- supabase/functions/duel/bundle.ts; then
            echo "::error title=Stale Edge bundle::supabase/functions/duel/bundle.ts is not what this commit builds. Run 'npm run server:build-edge' and commit it."
            exit 1
          fi
      - name: Deploy
        id: deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=Server not deployed::Add the SUPABASE_ACCESS_TOKEN repository secret to deploy the server automatically."
            echo "skipped=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx --yes supabase@2 functions deploy duel --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
      - name: Prove it — /v1/health lists this commit's bot version
        if: ${{ steps.deploy.outputs.skipped != '1' }}
        run: |
          want=$(node --import tsx -e "import('./src/bots/versions.ts').then(m => console.log(m.CURRENT_BOT_VERSION))")
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsS --max-time 30 "$HEALTH_URL" || true)
            if echo "$body" | grep -q "\"ok\":true" && echo "$body" | grep -q "\"$want\""; then
              echo "server is up and lists $want"; exit 0
            fi
            sleep 15
          done
          echo "::error title=Server health::/v1/health does not list $want after the deploy: $body"
          exit 1
