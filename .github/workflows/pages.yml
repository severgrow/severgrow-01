name: Deploy web game

# One artifact always preserves root Main, experimental Test and the verified Test2 candidate.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Test copy pushed', 'CI']
    branches: [dev, Main2.0]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Test copy pushed' || github.event.workflow_run.head_branch == 'Main2.0'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch == 'Main2.0' && github.event.workflow_run.head_sha || 'Main2.0' }}
          path: candidate
      - name: Require successful CI for the exact candidate commit
        uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            const sha = execFileSync('git', ['-C', 'candidate', 'rev-parse', 'HEAD'], {encoding:'utf8'}).trim();
            const deadline = Date.now() + 45 * 60 * 1000;
            while (Date.now() < deadline) {
              const {data} = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner, repo: context.repo.repo,
                workflow_id: 'ci.yml', head_sha: sha, per_page: 10
              });
              const run = data.workflow_runs.find(r => r.head_sha === sha && r.event === 'push');
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') throw new Error(`Candidate CI ${run.conclusion}: ${run.html_url}`);
                const {data: current} = await github.rest.repos.getBranch({owner:context.repo.owner, repo:context.repo.repo, branch:'Main2.0'});
                if (current.commit.sha !== sha) throw new Error(`Candidate ${sha} superseded by ${current.commit.sha}; wait for its CI`);
                core.info(`Verified exact candidate ${sha}: ${run.html_url}`);
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            throw new Error(`No successful CI for candidate ${sha}; publishing refused`);
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build protected Main
        working-directory: live
        run: npm ci && npm run web:build
      - name: Build experimental Test
        working-directory: dev
        run: |
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          CHANNEL=test npm run web:build
      - name: Verify and build Test2
        working-directory: candidate
        run: |
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          npm run check
          MAIN_REFERENCE="$GITHUB_WORKSPACE/live" node --import tsx scripts/classic-parity.ts
          CHANNEL=test2 npm run web:build
          CHANNEL=test2 node scripts/check-channel-assets.mjs
          npx playwright-core install --with-deps chromium
          node --import tsx web/e2e/test2-critical.ts
      - name: Compose all three versions and isolated offline routing
        run: |
          node candidate/scripts/compose-pages.mjs live/web/dist dev/web/dist candidate/web/dist site \
            "$(git -C live rev-parse HEAD)" "$(git -C dev rev-parse HEAD)" "$(git -C candidate rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
