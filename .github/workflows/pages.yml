name: Deploy web game

# One artifact always preserves root Main, experimental Test and the verified Test2 candidate.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Test copy pushed', 'CI']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.name == 'Test copy pushed' || github.event.workflow_run.head_branch == 'Main2.0'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: live
      - uses: actions/checkout@v4
        with:
          ref: dev
          path: dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch == 'Main2.0' && github.event.workflow_run.head_sha || 'Main2.0' }}
          path: candidate
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: '*/package-lock.json'
      - name: Build protected Main
        working-directory: live
        run: npm ci && npm run web:build
      - name: Build experimental Test
        working-directory: dev
        run: |
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          CHANNEL=test npm run web:build
      - name: Verify and build Test2
        working-directory: candidate
        run: |
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          npm run check
          MAIN_REFERENCE="$GITHUB_WORKSPACE/live" node --import tsx scripts/classic-parity.ts
          CHANNEL=test2 npm run web:build
          CHANNEL=test2 node scripts/check-channel-assets.mjs
          npx playwright-core install --with-deps chromium
          node --import tsx web/e2e/test2-critical.ts
      - name: Compose all three versions and isolated offline routing
        run: |
          node candidate/scripts/compose-pages.mjs live/web/dist dev/web/dist candidate/web/dist site \
            "$(git -C live rev-parse HEAD)" "$(git -C dev rev-parse HEAD)" "$(git -C candidate rev-parse HEAD)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
