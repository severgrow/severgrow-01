name: Futasaku 0.4 Pages preview

# futasaku.com is published from ONE branch: futa0.5-online, and only after CI passed on the exact
# commit (the ci-gate job). /futa0.4/ and /futa-test/ are still built from futa0.4's HEAD, and the
# published Main/Dev/Test2 SHAs are rebuilt and checked for parity, but a push to any other branch
# no longer publishes anything (owner decision, 2026-10-20). /2/ and /3/ are retired: they forward
# to the root (scripts/compose-retired-routes.mjs).
on:
  push:
    branches: [futa0.5-online]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # the CI gate reads this commit's CI result

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # futasaku.com never publishes a commit whose CI failed: wait for CI (ci.yml) on this exact
  # commit and stop here unless it passed. CI and this workflow both start on the same push, so
  # this waits ~20 min while CI runs; a red or cancelled CI leaves the site as it was.
  ci-gate:
    # A manual run from any other branch would publish that branch at the root: refuse it.
    if: github.ref_name == 'futa0.5-online'
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait for CI to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 150); do
            json=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=20" || echo '{}')
            state=$(echo "$json" | jq -r '[.workflow_runs // [] | .[]] | sort_by(.created_at) | last | if . == null then "waiting none" else "\(.status) \(.conclusion // "none")" end')
            echo "CI on $SHA: $state"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "::error::CI did not pass on $SHA ($state); not publishing"; exit 1 ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish on $SHA in time; not publishing"; exit 1

  build:
    needs: ci-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Futasaku 0.4 (+ futa-test) source
        uses: actions/checkout@v4
        with:
          path: preview
          ref: futa0.4
      - name: Check out Futasaku 0.5 online source
        uses: actions/checkout@v4
        with:
          path: futa05
          ref: ${{ github.sha }}
      - name: Read exact published source commits
        id: published
        run: |
          curl -fsSL --retry 3 -H 'Cache-Control: no-cache' \
            "https://severgrow.github.io/severgrow-01/release.json?preview=$(date +%s)" \
            -o published-release.json
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const release = JSON.parse(readFileSync("published-release.json", "utf8"));
            for (const key of ["main", "test", "test2"]) {
              if (!/^[0-9a-f]{40}$/.test(release[key])) throw Error(`Invalid published ${key} SHA`);
              appendFileSync(process.env.GITHUB_OUTPUT, `${key}=${release[key]}\n`);
            }
          '
      - name: Check out published versions without moving their branches
        env:
          MAIN_SHA: ${{ steps.published.outputs.main }}
          DEV_SHA: ${{ steps.published.outputs.test }}
          TEST2_SHA: ${{ steps.published.outputs.test2 }}
        run: |
          git -C preview fetch --no-tags origin "$MAIN_SHA" "$DEV_SHA" "$TEST2_SHA"
          git -C preview worktree add --detach "$GITHUB_WORKSPACE/live" "$MAIN_SHA"
          git -C preview worktree add --detach "$GITHUB_WORKSPACE/dev" "$DEV_SHA"
          git -C preview worktree add --detach "$GITHUB_WORKSPACE/candidate" "$TEST2_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            preview/package-lock.json
            futa05/package-lock.json
      - name: Install and validate Futasaku 0.4
        working-directory: preview
        run: |
          npm ci
          npm run check
          CHANNEL=futa04 npm run web:build
          CHANNEL=futa04 node scripts/check-channel-assets.mjs
          mv web/dist web/dist-futa04
          CHANNEL=futa-test npm run web:build
          CHANNEL=futa-test node scripts/check-channel-assets.mjs
          mv web/dist web/dist-futa-test
          mv web/dist-futa04 web/dist
      - name: Build /futa0.5/ preview channel
        working-directory: futa05
        env:
          CHANNEL: futa05
          VITE_FIND_OPPONENT: '1'
          VITE_DUEL_API_URL: ${{ vars.VITE_DUEL_API_URL || vars.FUTA05_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          for v in VITE_DUEL_API_URL VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY; do
            test -n "${!v}" || { echo "Missing Actions Variable $v (VITE_DUEL_API_URL may fall back to FUTA05_API_URL)"; exit 1; }
          done
          npm ci
          npm run web:build
          node scripts/check-channel-assets.mjs
          echo "$(git rev-parse HEAD)" > web/dist/BUILD_SHA
      # The admin dashboard (futasaku.com/admin/). Its own build, so no player ever downloads it.
      # Published only because the compose step below is handed `web/dist-admin`; remove that
      # argument and the composed site is byte-identical to what shipped before.
      - name: Build the admin dashboard
        working-directory: futa05
        env:
          VITE_DUEL_API_URL: ${{ vars.VITE_DUEL_API_URL || vars.FUTA05_API_URL }}
        run: |
          test -n "$VITE_DUEL_API_URL" || { echo "Missing Actions Variable VITE_DUEL_API_URL (may fall back to FUTA05_API_URL)"; exit 1; }
          npm run admin:build
      - name: Rebuild current published versions at their exact SHAs
        run: |
          cd live
          npm ci
          npm run web:build
          cd ../dev
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          CHANNEL=test npm run web:build
          cd ../candidate
          if cmp -s package-lock.json ../live/package-lock.json; then ln -s ../live/node_modules node_modules; else npm ci; fi
          CHANNEL=test2 npm run web:build
      - name: Compose routes and verify existing public bytes
        env:
          MAIN_SHA: ${{ steps.published.outputs.main }}
          DEV_SHA: ${{ steps.published.outputs.test }}
          TEST2_SHA: ${{ steps.published.outputs.test2 }}
        run: |
          node candidate/scripts/compose-pages.mjs live/web/dist dev/web/dist candidate/web/dist site \
            "$MAIN_SHA" "$DEV_SHA" "$TEST2_SHA"
          node preview/scripts/compose-futasaku-preview.mjs site preview/web/dist "$(git -C preview rev-parse HEAD)" preview/web/dist-futa-test
          node futa05/scripts/compose-futa05-preview.mjs site futa05/web/dist "$(git -C futa05 rev-parse HEAD)" futa05/web/dist-admin
          node futa05/scripts/compose-retired-routes.mjs site
          node preview/scripts/check-pages-parity.mjs site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
